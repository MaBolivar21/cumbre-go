<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B2B24"><title>Cumbre Salvaje GO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--color-bg:#F6F1E7;--color-surface:#FFFDF8;--color-text:#171A18;--color-accent:#F26A2E;--color-accent-600:#d9551c;--color-accent-700:#b8430f;--radius-sm:12px;--radius-md:16px;--radius-lg:22px}
body{margin:0;background:#e6e0d3;font-family:"Archivo",system-ui,sans-serif;color:#171A18;font-size:15px}
a{color:#F26A2E}a:hover{color:#d9551c}
*{box-sizing:border-box}
input{font-family:inherit}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #F26A2E;outline-offset:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes detailIn{0%{opacity:0;transform:scale(.92) translateY(28px);border-radius:28px}100%{opacity:1;transform:none;border-radius:0}}
@keyframes momentIn{0%{opacity:0;transform:translateY(6%) scale(1.02)}100%{opacity:1;transform:none}}
@keyframes frameIn{0%{opacity:0;transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
@keyframes splashLogo{0%{opacity:0;transform:scale(.86)}60%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes splashBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{0%{opacity:.45}50%{opacity:.9}100%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes topoDraw{0%{stroke-dashoffset:900;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes qrIn{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
@keyframes readyIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes badgePop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.hs::-webkit-scrollbar{display:none}
.hs{scrollbar-width:none}
/* El snap del carril vive aquí y no en el estilo inline: React re-aplica los estilos en
   cada render y borraría la suspensión temporal que necesita la animación de los botones. */
.rail-snap{scroll-snap-type:x proximity}


html,body{margin:0;width:100%;height:100%;min-height:100%;background:#e6e0d3;overflow:hidden}
body{display:flex;justify-content:center;align-items:flex-start}
#app{width:100%;height:100%;display:flex;justify-content:center;align-items:flex-start}
.production-device{width:402px;height:100dvh;max-height:874px;min-height:620px;background:#F6F1E7;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(23,26,24,.18)}
@media (max-width:480px){html,body{background:#F6F1E7}.production-device{width:100vw;height:100dvh;max-height:none;min-height:0;box-shadow:none}}
/* Improve safe-area behavior on real phones */
@supports(padding:max(0px)){.production-device{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}}
</style></head><body><div id="app"><div id="appRoot" class="production-device"></div></div>
<template id="dc-template">
  <div style="height:100%;display:flex;flex-direction:column;background:#F6F1E7;color:#171A18;font-family:'Archivo',system-ui,sans-serif;position:relative;overflow:hidden">

    <!-- SPLASH -->
    <sc-if value="{{ isSplash }}" hint-placeholder-val="{{ true }}">
      <div data-screen-label="Splash" onClick="{{ goHome }}" style="flex:1;background:#0B2B24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;cursor:pointer;position:relative">
        <img src="img/logo-cumbre-transparente.png" alt="Cumbre Salvaje" style="width:240px;height:auto;display:block;animation:splashLogo .9s cubic-bezier(.2,.8,.2,1) both">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;animation:fadeIn .8s .5s both">
          <div style="font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#F6F1E7;font-weight:800">Cumbre GO</div>
          <div style="width:88px;height:3px;border-radius:2px;background:#F26A2E;transform-origin:left;animation:splashBar 1.4s .6s cubic-bezier(.2,.8,.2,1) both"></div>
        </div>
        <div style="position:absolute;bottom:52px;font-size:11px;color:rgba(246,241,231,.55);animation:fadeIn 1s 1.2s both">Aventura · Naturaleza · Experiencias inolvidables</div>
      </div>
    </sc-if>

    <!-- HOME -->
    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Inicio" style="flex:1;overflow-y:auto;overflow-x:hidden;animation:fadeUp .35s ease both" class="hs">
        <div style="position:relative;height:520px;background:#0B2B24">
          <img src="img/24-portada-amigos-ranger-puente.jpg" alt="Ranger cruzando el puente colgante de Cumbre Salvaje" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%">
          <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,43,36,.42) 0%,rgba(11,43,36,0) 30%,rgba(11,43,36,0) 48%,rgba(11,43,36,.94) 100%)"></div>
          <div style="position:absolute;top:60px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center">
            <img src="img/logo-cumbre-transparente.png" alt="Cumbre Salvaje" style="width:118px;height:auto;display:block">
            <button onClick="{{ goTipo }}" style="height:38px;padding:0 14px;border-radius:999px;background:rgba(246,241,231,.16);backdrop-filter:blur(12px);border:1px solid rgba(246,241,231,.3);color:#F6F1E7;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px">{{ visitLabel }}<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></button>
          </div>
          <div style="position:absolute;left:20px;right:20px;bottom:28px;display:flex;flex-direction:column;gap:10px">
            <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#F6B26B;font-weight:800">{{ homeKicker }}</div>
            <div style="font-size:38px;font-weight:800;line-height:1;letter-spacing:-.025em;color:#F6F1E7;text-wrap:pretty">{{ homeTitle }}</div>
            <div style="font-size:15px;color:rgba(246,241,231,.82);line-height:1.4">Arma una experiencia a tu medida.</div>
          </div>
        </div>

        <div style="padding:26px 0 0;display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 20px">
            <div style="font-size:20px;font-weight:800;letter-spacing:-.015em">{{ recoKicker }}</div>
            <button onClick="{{ goExplorarTodo }}" style="background:none;border:0;padding:0;font-size:13px;font-weight:600;color:#F26A2E">Ver todo</button>
          </div>
          <div style="display:flex;gap:12px;overflow-x:auto;padding:0 20px 6px;scroll-snap-type:x mandatory;scroll-padding:20px" class="hs">
            <sc-for list="{{ recos }}" as="r" hint-placeholder-count="3">
              <button onClick="{{ r.open }}" style="flex:none;width:228px;height:310px;scroll-snap-align:start;text-align:left;padding:0;border:0;border-radius:22px;background:{{ r.tile }};position:relative;overflow:hidden;color:#F6F1E7;box-shadow:0 10px 26px rgba(23,26,24,.14);transition:transform .15s" style-active="transform:scale(.97)">
                <sc-if value="{{ r.hasImg }}" hint-placeholder-val="{{ true }}"><img src="{{ r.img }}" alt="{{ r.name }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ r.ipos }}"></sc-if>
                <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,43,36,0) 40%,rgba(11,43,36,.92) 100%)"></div>
                <sc-if value="{{ r.noImg }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:22px;left:18px;width:56px;height:56px;border-radius:16px;background:rgba(246,241,231,.14);display:flex;align-items:center;justify-content:center">{{ r.iconEl }}</div></sc-if>
                <div style="position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:4px">
                  <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#F6B26B;font-weight:800">{{ r.group }}</div>
                  <div style="font-size:21px;font-weight:800;line-height:1.05;letter-spacing:-.015em">{{ r.name }}</div>
                  <div style="font-size:12px;color:rgba(246,241,231,.82)">{{ r.priceLabel }}</div>
                </div>
              </button>
            </sc-for>
          </div>
        </div>

        <div style="padding:26px 20px 0">
          <button onClick="{{ goMomentos }}" style="width:100%;height:230px;text-align:left;padding:0;border:0;border-radius:24px;position:relative;overflow:hidden;color:#F6F1E7;background:#0B2B24;box-shadow:0 14px 34px rgba(23,26,24,.18);transition:transform .15s" style-active="transform:scale(.98)">
            <img src="img/05-tirolesa-emocion.jpg" alt="Emoción en la tirolesa" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%">
            <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,43,36,.85) 0%,rgba(11,43,36,.35) 60%,rgba(11,43,36,.1) 100%)"></div>
            <div style="position:absolute;left:20px;top:20px;bottom:20px;display:flex;flex-direction:column;justify-content:space-between;width:60%">
              <div style="width:48px;height:48px;border-radius:999px;background:#F6F1E7;color:#0B2B24;display:flex;align-items:center;justify-content:center;padding-left:3px"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg></div>
              <div style="display:flex;flex-direction:column;gap:6px">
                <div style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#F6B26B;font-weight:800">Momentos Salvajes</div>
                <div style="font-size:26px;font-weight:800;line-height:1;letter-spacing:-.02em">Mira cómo se vive.</div>
                <div style="font-size:13px;color:rgba(246,241,231,.82)">Fotos y videos del parque, uno tras otro.</div>
              </div>
            </div>
          </button>
        </div>

        <div style="padding:30px 20px 0;display:flex;flex-direction:column;gap:14px">
          <div style="font-size:20px;font-weight:800;letter-spacing:-.015em">Explora el parque</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:150px;gap:12px">
            <sc-for list="{{ homeCats }}" as="c" hint-placeholder-count="5">
              <button onClick="{{ c.go }}" style="text-align:left;padding:0;border:0;border-radius:20px;background:linear-gradient(160deg,#3a423d 0%,#171A18 100%);position:relative;overflow:hidden;color:#F6F1E7;grid-row:{{ c.span }};transition:transform .15s" style-active="transform:scale(.97)">
                <img src="{{ c.img }}" alt="{{ c.name }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ c.pos }}">
                <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,43,36,0) 40%,rgba(11,43,36,.88) 100%)"></div>
                <div style="position:absolute;left:14px;right:14px;bottom:14px;display:flex;flex-direction:column;gap:2px"><div style="font-size:16px;font-weight:800;line-height:1.1">{{ c.name }}</div><sc-if value="{{ c.hasSub }}" hint-placeholder-val="{{ false }}"><div style="font-size:11px;color:rgba(246,241,231,.8);line-height:1.3">{{ c.sub }}</div></sc-if></div>
              </button>
            </sc-for>
          </div>
        </div>

        <div style="padding:30px 20px 0;display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <div style="font-size:20px;font-weight:800;letter-spacing:-.015em">Así funciona</div>
            <sc-if value="{{ howShowArrows }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;gap:6px;flex:none">
                <button onClick="{{ howPrev }}" data-how-arrow="prev" aria-label="Ver paso anterior" style="width:44px;height:44px;border-radius:999px;border:0;background:#FFFDF8;color:#171A18;box-shadow:0 1px 2px rgba(23,26,24,.1);display:flex;align-items:center;justify-content:center;padding:0;transition:opacity .2s,transform .12s" style-active="transform:scale(.92)" style-focus="outline:2px solid #F26A2E;outline-offset:2px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
                <button onClick="{{ howNext }}" data-how-arrow="next" aria-label="Ver paso siguiente" style="width:44px;height:44px;border-radius:999px;border:0;background:#FFFDF8;color:#171A18;box-shadow:0 1px 2px rgba(23,26,24,.1);display:flex;align-items:center;justify-content:center;padding:0;transition:opacity .2s,transform .12s" style-active="transform:scale(.92)" style-focus="outline:2px solid #F26A2E;outline-offset:2px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
              </div>
            </sc-if>
          </div>
          <div ref="{{ howRef }}" tabindex="0" role="group" aria-label="Cómo funciona la reservación" style="display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:0 0 6px;cursor:grab;user-select:none;-webkit-user-select:none" style-focus="outline:2px solid #F26A2E;outline-offset:4px" class="hs rail-snap">
            <div style="flex:none;width:200px;padding:16px;border-radius:18px;background:#FFFDF8;box-shadow:0 1px 2px rgba(23,26,24,.06);display:flex;flex-direction:column;gap:8px;scroll-snap-align:start"><div style="width:28px;height:28px;border-radius:999px;background:#F26A2E;color:#F6F1E7;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center">1</div><div style="font-size:14px;line-height:1.35;font-weight:600">Arma tu aventura y ve el total estimado en tiempo real.</div></div>
            <div style="flex:none;width:200px;padding:16px;border-radius:18px;background:#FFFDF8;box-shadow:0 1px 2px rgba(23,26,24,.06);display:flex;flex-direction:column;gap:8px;scroll-snap-align:start"><div style="width:28px;height:28px;border-radius:999px;background:#F26A2E;color:#F6F1E7;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center">2</div><div style="font-size:14px;line-height:1.35;font-weight:600">Envía tu Pase de Aventura al WhatsApp oficial.</div></div>
            <div style="flex:none;width:200px;padding:16px;border-radius:18px;background:#FFFDF8;box-shadow:0 1px 2px rgba(23,26,24,.06);display:flex;flex-direction:column;gap:8px;scroll-snap-align:start"><div style="width:28px;height:28px;border-radius:999px;background:#F26A2E;color:#F6F1E7;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center">3</div><div style="font-size:14px;line-height:1.35;font-weight:600">Aparta con el 50% y recibe tu Pase Salvaje con QR.</div></div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;padding-top:2px">
            <sc-for list="{{ howDots }}" as="d" hint-placeholder-count="3"><button onClick="{{ d.go }}" data-how-dot="{{ d.i }}" aria-label="Ir al paso" style="height:6px;border-radius:999px;border:0;padding:0;transition:width .25s,background .25s" style-focus="outline:2px solid #F26A2E;outline-offset:3px"></button></sc-for>
          </div>
        </div>
        <div style="height:190px"></div>
      </div>
      <div style="position:absolute;left:0;right:0;bottom:100px;padding:0 20px;pointer-events:none">
        <button onClick="{{ startBuilder }}" style="pointer-events:auto;width:100%;height:58px;border-radius:18px;background:#F26A2E;color:#F6F1E7;border:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:16px;font-weight:800;box-shadow:0 14px 34px rgba(242,106,46,.35);transition:transform .12s" style-active="transform:scale(.985);background:#d9551c">Armar mi aventura<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </sc-if>

    <!-- TIPO DE VISITA -->
    <sc-if value="{{ isTipo }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Tipo de visita" style="flex:1;display:flex;flex-direction:column;min-height:0;animation:fadeUp .35s ease both">
        <div style="padding:64px 20px 0;display:flex;align-items:center;gap:12px">
          <button onClick="{{ back }}" style="width:40px;height:40px;border-radius:999px;border:0;background:#FFFDF8;box-shadow:0 1px 3px rgba(23,26,24,.12);display:flex;align-items:center;justify-content:center;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button>
          <div style="font-size:12px;font-weight:600;color:rgba(23,26,24,.6)">Personaliza tu inicio</div>
        </div>
        <div style="padding:22px 20px 14px;font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em">¿Con quién vienes?</div>
        <div style="flex:1;overflow:auto;padding:0 20px 40px;display:flex;flex-direction:column;gap:10px" class="hs">
          <sc-for list="{{ visitTypes }}" as="t" hint-placeholder-count="6">
            <button onClick="{{ t.select }}" style="width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border:2px solid {{ t.border }};border-radius:18px;background:{{ t.bg }};color:#171A18;transition:transform .12s" style-active="transform:scale(.98)">
              <div style="display:flex;flex-direction:column;gap:3px">
                <div style="font-size:18px;font-weight:800;letter-spacing:-.01em">{{ t.label }}</div>
                <div style="font-size:12px;color:rgba(23,26,24,.6)">{{ t.hint }}</div>
              </div>
              <div style="width:24px;height:24px;border-radius:999px;border:2px solid {{ t.ring }};background:{{ t.fill }};flex:none"></div>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- EXPLORAR -->
    <sc-if value="{{ isExplorar }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Explorar" style="flex:1;display:flex;flex-direction:column;animation:fadeUp .35s ease both;min-height:0">
        <div style="padding:64px 20px 0;display:flex;align-items:center;gap:12px">
          <button onClick="{{ goHome }}" style="width:40px;height:40px;border-radius:999px;border:0;background:#FFFDF8;box-shadow:0 1px 3px rgba(23,26,24,.12);display:flex;align-items:center;justify-content:center;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button>
          <div style="font-size:26px;font-weight:800;letter-spacing:-.02em">Explorar</div>
        </div>
        <div ref="{{ chipsRef }}" style="display:flex;gap:8px;margin-top:16px;padding:0 20px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;width:100%;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-x" class="hs">
          <sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
            <button onClick="{{ c.select }}" data-chip="{{ c.id }}" style="flex:none;height:40px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;border:0;background:{{ c.bg }};color:{{ c.color }};white-space:nowrap;transition:background .2s,color .2s,transform .12s;box-shadow:0 1px 2px rgba(23,26,24,.06);cursor:inherit;user-select:none" style-active="transform:scale(.95)">{{ c.name }}</button>
          </sc-for>
          <div style="flex:none;width:20px;height:1px"></div>
        </div>
        <div style="flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 130px;display:flex;flex-direction:column;gap:14px" class="hs">
          <sc-if value="{{ loadingExplore }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:14px">
              <div style="height:240px;border-radius:22px;background:#dcd6ca;animation:shimmer 1.2s infinite"></div>
              <div style="height:14px;width:60%;border-radius:7px;background:#dcd6ca;animation:shimmer 1.2s .1s infinite"></div>
              <div style="height:12px;width:40%;border-radius:6px;background:#dcd6ca;animation:shimmer 1.2s .2s infinite"></div>
              <div style="height:96px;border-radius:18px;background:#dcd6ca;animation:shimmer 1.2s .3s infinite;margin-top:10px"></div>
              <div style="height:96px;border-radius:18px;background:#dcd6ca;animation:shimmer 1.2s .4s infinite"></div>
            </div>
          </sc-if>
          <sc-if value="{{ showExplore }}" hint-placeholder-val="{{ true }}">
            <sc-for list="{{ exploreItems }}" as="e" hint-placeholder-count="3">
              <sc-if value="{{ e.hasImg }}" hint-placeholder-val="{{ true }}">
                <button onClick="{{ e.open }}" style="text-align:left;padding:0;border:0;background:transparent;color:#171A18;display:flex;flex-direction:column;gap:10px;animation:fadeUp .4s ease both;transition:transform .15s" style-active="transform:scale(.98)">
                  <div style="position:relative;width:100%;height:250px;border-radius:22px;background:#0B2B24;overflow:hidden;box-shadow:0 10px 26px rgba(23,26,24,.12)">
                    <img src="{{ e.img }}" alt="{{ e.name }}" style="width:100%;height:100%;object-fit:cover;object-position:{{ e.ipos }};display:block">
                    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,43,36,.25) 0%,rgba(11,43,36,0) 30%)"></div>
                    <div style="position:absolute;top:14px;left:14px;border-radius:999px;background:rgba(246,241,231,.92);color:#171A18;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;padding:6px 10px">{{ e.group }}</div>
